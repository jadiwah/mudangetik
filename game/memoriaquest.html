<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Memoria Quest - Misi Membangun Istana Memori</title>

    <!-- Tailwind CSS for UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel for in-browser JSX transpilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Three.js for 3D Loci Environment -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Nunito', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }

        #root {
            width: 100%;
            height: 100%;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1e293b;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #4f46e5;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #6366f1;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .cozy-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        /* 3D Canvas Container */
        #game-canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Crosshair */
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }

        /* Mobile Controls */
        .mobile-btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: white;
            user-select: none;
            touch-action: none;
        }

        .mobile-btn:active {
            background: rgba(255, 255, 255, 0.4);
        }

        /* Minimap Styles */
        .minimap-container {
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #38bdf8;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
            backdrop-filter: blur(8px);
        }

        .minimap-dot {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #fcd34d;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 5px #fcd34d;
        }

        .player-dot {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #38bdf8;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px #38bdf8;
            z-index: 10;
            transition: all 0.1s;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- DATA & CONFIGURATION ---
        const LOCI_SHAPES = ['box', 'sphere', 'cylinder', 'cone'];
        const LOCI_COLORS = [0xfca5a5, 0xfcd34d, 0x93c5fd, 0xd8b4fe, 0x86efac, 0xfef08a, 0xf472b6, 0x67e8f9];

        const DUMMY_VOCABS = [
            { en: "Apple", id: "Apel", location: "di atas sofa", action: "bernyanyi kencang" },
            { en: "Book", id: "Buku", location: "di dalam kulkas", action: "terbakar api biru" },
            { en: "Cat", id: "Kucing", location: "bergelantungan di lampu", action: "membaca koran" },
            { en: "Dog", id: "Anjing", location: "di wastafel", action: "pakai kacamata" },
            { en: "Elephant", id: "Gajah", location: "di atas lemari", action: "menari balet" },
            { en: "Fish", id: "Ikan", location: "terbang di ruang tamu", action: "mengejar kupu-kupu" },
            { en: "Grape", id: "Anggur", location: "di bawah karpet", action: "membesar seperti bola bowling" },
            { en: "Hat", id: "Topi", location: "di tempat sampah", action: "berbicara sendiri" },
            { en: "Ice", id: "Es", location: "di atas TV", action: "mencair jadi pelangi" },
            { en: "Juice", id: "Jus", location: "di rak sepatu", action: "menyiram tanaman otomatis" }
        ];
const TRIAL_KEY = 'rpg_loci_trial_used_v1';
const UNLOCK_KEY = 'rpg_loci_unlocked_v1';
const GAME_PASSWORD = 'ISIGFORMDULU';
const GFORM_URL = 'https://forms.gle/cttif4iceDEjwNLH6';

const safeGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const safeSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

const isUnlocked = () => safeGet(UNLOCK_KEY) === 'true';
const isTrialUsed = () => safeGet(TRIAL_KEY) === 'true' && !isUnlocked();
const markTrialUsed = () => { if (!isUnlocked()) safeSet(TRIAL_KEY, 'true'); };

const ScreenLocked = ({ onUnlock }) => {
    const [code, setCode] = useState('');
    const [error, setError] = useState('');

    const handleSubmit = (e) => {
        e.preventDefault();
        if (code.trim().toUpperCase() === GAME_PASSWORD) {
            safeSet(UNLOCK_KEY, 'true');
            onUnlock();
        } else {
            setError('Password salah. Isi Google Form dulu untuk mendapatkan password.');
        }
    };

    return (
        <div className="flex flex-col items-center justify-center h-full text-center p-6 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-800 via-slate-900 to-black">
            <div className="text-7xl mb-6 drop-shadow-[0_0_20px_rgba(251,191,36,0.6)]">🔒</div>
            <h1 className="text-4xl font-black text-amber-400 mb-3">Trial Telah Berakhir</h1>
            <p className="text-slate-300 max-w-md mb-2">
                Kamu sudah menuntaskan 1x misi percobaan di Memoria Quest. Istana Memorimu kini terkunci.
            </p>
            <p className="text-slate-500 text-sm max-w-md mb-8">
                Masukkan password untuk membuka gembok dan lanjut membangun istana memori.
            </p>

            <form onSubmit={handleSubmit} className="w-full max-w-sm">
                <div className="flex gap-2">
                    <input
                        type="password"
                        value={code}
                        onChange={(e) => { setCode(e.target.value); setError(''); }}
                        placeholder="Masukkan password"
                        className="flex-1 bg-slate-800 border border-slate-600 rounded-xl p-4 text-white text-lg focus:outline-none focus:border-amber-400"
                    />
                    <button
                        type="submit"
                        disabled={!code.trim()}
                        className="px-6 bg-amber-500 hover:bg-amber-400 disabled:bg-slate-700 disabled:text-slate-500 text-slate-900 font-black rounded-xl cozy-shadow transition-colors"
                    >
                        🔓 Buka
                    </button>
                </div>
                {error && <p className="mt-3 text-red-400 text-sm font-bold">{error}</p>}
            </form>

            <a
                href={GFORM_URL}
                target="_blank"
                rel="noopener noreferrer"
                className="mt-10 text-sky-400 hover:text-sky-300 underline underline-offset-4 font-bold"
            >
                Dapatkan Password
            </a>
            <p className="mt-4 text-slate-600 text-xs font-semibold uppercase tracking-widest">Sebuah Inovasi by MudaNgetik</p>
        </div>
    );
};
        // --- COMPONENTS ---

        // 1. MAIN MENU
        const ScreenMenu = ({ onSelect }) => (
            <div className="flex flex-col items-center justify-center h-full text-center p-6 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-indigo-900 via-slate-900 to-black">
                <div className="mb-8 animate-bounce">
                    <svg className="w-24 h-24 mx-auto text-indigo-400 drop-shadow-[0_0_15px_rgba(99,102,241,0.8)]" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <h1 className="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-400 mb-2 drop-shadow-lg">
                    Memoria Quest
                </h1>
                <p className="text-xl text-indigo-200 mb-12 font-bold tracking-widest">MISI MEMBANGUN ISTANA MEMORI</p>
                
                <div className="flex flex-col sm:flex-row gap-6">
                    <button onClick={() => onSelect(10)} className="group relative px-8 py-4 bg-indigo-600 hover:bg-indigo-500 rounded-2xl cozy-shadow transition-all hover:scale-105 overflow-hidden">
                        <div className="absolute inset-0 w-full h-full bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:animate-[shimmer_1.5s_infinite]"></div>
                        <span className="block text-2xl font-bold mb-1 text-white">Prajurit Budiman</span>
                        <span className="text-indigo-200 text-sm">10 Kosakata Dasar</span>
                    </button>
                    <button onClick={() => onSelect(30)} className="group relative px-8 py-4 bg-purple-600 hover:bg-purple-500 rounded-2xl cozy-shadow transition-all hover:scale-105 overflow-hidden">
                        <div className="absolute inset-0 w-full h-full bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:animate-[shimmer_1.5s_infinite]"></div>
                        <span className="block text-2xl font-bold mb-1 text-white">Ksatria Sejati</span>
                        <span className="text-purple-200 text-sm">30 Kosakata Lanjut</span>
                    </button>
                </div>
                <p className="mt-12 text-slate-500 text-sm font-semibold uppercase tracking-widest">Sebuah Inovasi by MudaNgetik</p>
            </div>
        );

        // 2. VOCAB INPUT
        const ScreenInput = ({ count, onComplete }) => {
            const [vocabs, setVocabs] = useState(Array(count).fill({ en: '', id: '' }));

            const updateVocab = (index, field, value) => {
                const newVocabs = [...vocabs];
                newVocabs[index] = { ...newVocabs[index], [field]: value };
                setVocabs(newVocabs);
            };

            const fillDummy = () => {
                const filled = Array(count).fill({ en: '', id: '' }).map((_, i) => {
                    const dummy = DUMMY_VOCABS[i % DUMMY_VOCABS.length];
                    return { en: dummy.en + (i >= 10 ? ` ${i}` : ''), id: dummy.id + (i >= 10 ? ` ${i}` : '') };
                });
                setVocabs(filled);
            };

            const isComplete = vocabs.every(v => v.en.trim() !== '' && v.id.trim() !== '');

            return (
                <div className="h-full flex flex-col p-4 sm:p-8 bg-slate-900">
                    <div className="flex justify-between items-center mb-6">
                        <div>
                            <h2 className="text-3xl font-bold text-white">Input Kosakata Loci</h2>
                            <p className="text-slate-400">Masukkan {count} pasangan kata (Inggris - Indonesia).</p>
                        </div>
                        <button onClick={fillDummy} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-amber-400 rounded-lg font-bold border border-slate-700 flex items-center gap-2 transition-colors">
                            ⚡ Isi Contoh Cepat
                        </button>
                    </div>

                    <div className="flex-1 overflow-y-auto pr-2 pb-24">
                        <div className="space-y-3">
                            {vocabs.map((v, i) => (
                                <div key={i} className="flex gap-4 p-4 glass-panel rounded-xl items-center">
                                    <span className="text-slate-500 font-bold w-8 text-center">{i + 1}.</span>
                                    <input 
                                        type="text" placeholder="Inggris (Misl: Apple)" 
                                        value={v.en} onChange={(e) => updateVocab(i, 'en', e.target.value)}
                                        className="flex-1 bg-slate-800/50 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-indigo-500"
                                    />
                                    <input 
                                        type="text" placeholder="Indonesia (Misl: Apel)" 
                                        value={v.id} onChange={(e) => updateVocab(i, 'id', e.target.value)}
                                        className="flex-1 bg-slate-800/50 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-indigo-500"
                                    />
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="absolute bottom-0 left-0 w-full p-6 bg-gradient-to-t from-slate-900 via-slate-900 to-transparent flex justify-center">
                        <button 
                            onClick={() => onComplete(vocabs)} 
                            disabled={!isComplete}
                            className={`px-12 py-4 rounded-xl font-bold text-xl cozy-shadow transition-all ${isComplete ? 'bg-indigo-600 hover:bg-indigo-500 text-white hover:scale-105' : 'bg-slate-800 text-slate-500 cursor-not-allowed'}`}
                        >
                            Lanjut Merangkai Cerita ➔
                        </button>
                    </div>
                </div>
            );
        };

        // 3. STORY ASSIGNMENT
        const ScreenAssign = ({ vocabs, lociLimit, onComplete }) => {
            const [assignments, setAssignments] = useState(
                vocabs.map((v, i) => ({
                    ...v,
                    location: '',
                    action: ''
                }))
            );
            const [masterStory, setMasterStory] = useState('');

            const updateItem = (index, field, value) => {
                const newAssign = [...assignments];
                newAssign[index][field] = value;
                setAssignments(newAssign);
            };

            const fillDummyStory = () => {
                const filled = assignments.map((a, i) => {
                    const dummy = DUMMY_VOCABS[i % DUMMY_VOCABS.length];
                    return {
                        ...a,
                        location: dummy.location + (i >= 10 ? ` ${i}` : ''),
                        action: dummy.action + (i >= 10 ? ` ${i}` : '')
                    };
                });
                setAssignments(filled);
                setMasterStory("Hari ini saya masuk istana memori. Saya melihat Apel bernyanyi kencang di atas sofa, lalu ada Buku yang terbakar api biru di dalam kulkas...");
            };

            const isItemsComplete = assignments.every(a => a.location.trim() !== '' && a.action.trim() !== '');

            return (
                <div className="h-full flex flex-col p-4 sm:p-8 bg-[#0f172a]">
                    <div className="flex justify-between items-center mb-6">
                        <div>
                            <h2 className="text-3xl font-bold text-amber-400">Pasak Memori (Pegging)</h2>
                            <p className="text-slate-300">Tentukan tempat dan aktivitas konyol untuk setiap kosakata!</p>
                        </div>
                        <button onClick={fillDummyStory} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-amber-400 rounded-lg font-bold border border-slate-700 flex items-center gap-2 transition-colors shadow-lg">
                            ⚡ Isi Contoh Cepat
                        </button>
                    </div>

                    <div className="flex-1 overflow-y-auto pr-2 pb-32 space-y-6">
                        {assignments.map((item, i) => (
                            <div key={i} className="bg-[#1e293b] p-5 rounded-xl border border-slate-700 shadow-md">
                                <div className="flex justify-between items-center border-b border-slate-700 pb-3 mb-4">
                                    <span className="text-amber-400 font-bold text-lg">
                                        Kata [{i + 1}]: {item.en} ({item.id})
                                    </span>
                                    <span className="text-xs bg-slate-800 text-slate-400 px-2 py-1 rounded">Tempat & Aktivitas Loci</span>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <input 
                                        type="text"
                                        placeholder="Di mana? (cth: di atas sofa)"
                                        value={item.location}
                                        onChange={(e) => updateItem(i, 'location', e.target.value)}
                                        className="w-full bg-[#0f172a] border border-indigo-500/50 rounded-lg p-3 text-white focus:outline-none focus:border-amber-400"
                                    />
                                    <input 
                                        type="text"
                                        placeholder="Sedang apa? (cth: bernyanyi kencang)"
                                        value={item.action}
                                        onChange={(e) => updateItem(i, 'action', e.target.value)}
                                        className="w-full bg-[#0f172a] border border-indigo-500/50 rounded-lg p-3 text-white focus:outline-none focus:border-amber-400"
                                    />
                                </div>
                            </div>
                        ))}

                        {/* Master Story Area */}
                        <div className="bg-[#1e293b] p-5 rounded-xl border border-indigo-500 shadow-lg mt-8">
                            <h3 className="text-amber-400 font-bold mb-2 flex items-center gap-2">
                                📖 Gabungan Cerita Utuh (Opsional):
                            </h3>
                            <p className="text-slate-400 text-sm mb-3">
                                Tulis bebas merangkai semua kosakata, tempat, dan aktivitas ke dalam satu cerita konyol untuk memperkuat ingatanmu:
                            </p>
                            <textarea 
                                placeholder="Contoh: Hari ini saya berjalan ke ruang tamu dan melihat Apel sedang bernyanyi kencang di atas sofa..."
                                value={masterStory}
                                onChange={(e) => setMasterStory(e.target.value)}
                                className="w-full bg-[#0f172a] border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-amber-400 resize-none h-32"
                            />
                        </div>
                    </div>

                    <div className="absolute bottom-0 left-0 w-full p-6 bg-gradient-to-t from-slate-900 via-slate-900 to-transparent flex justify-center z-10">
                        <button 
                            onClick={() => onComplete(assignments)} 
                            disabled={!isItemsComplete}
                            className={`px-12 py-4 rounded-xl font-bold text-xl cozy-shadow transition-all ${isItemsComplete ? 'bg-indigo-600 hover:bg-indigo-500 text-white hover:scale-105' : 'bg-slate-800 text-slate-500 cursor-not-allowed'}`}
                        >
                            Masuk ke Istana Memori ➔
                        </button>
                    </div>
                </div>
            );
        };

        // 4. 3D EXPLORATION MODE
        const ScreenExplore = ({ assignedData, onFinishWalk }) => {
            const canvasRef = useRef(null);
            const playerDotRef = useRef(null);
            const [interactionInfo, setInteractionInfo] = useState(null);
            const [mapData, setMapData] = useState([]);
            
            // Movement states & Joystick ref
            const keys = useRef({ w: false, a: false, s: false, d: false, left: false, right: false });
            const joystickRef = useRef({ active: false, x: 0, y: 0, centerX: 0, centerY: 0 });

            const updateJoystick = (clientX, clientY) => {
                const maxDist = 40;
                let dx = clientX - joystickRef.current.centerX;
                let dy = clientY - joystickRef.current.centerY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance > maxDist) {
                    dx = (dx / distance) * maxDist;
                    dy = (dy / distance) * maxDist;
                }
                
                const thumb = document.getElementById('mobile-joystick-thumb');
                if (thumb) {
                    thumb.style.transform = `translate(${dx}px, ${dy}px)`;
                }
                
                joystickRef.current.x = dx / maxDist;
                joystickRef.current.y = dy / maxDist;
            };

            useEffect(() => {
                if (!canvasRef.current) return;

                // --- THREE.JS INITIALIZATION ---
                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x1e1b4b); // Deep cozy night/dream
                scene.fog = new THREE.Fog(0x1e1b4b, 10, 80);

                const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 3, 0); // Player height

                const renderer = new THREE.WebGLRenderer({ canvas: canvasRef.current, antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

                // Lights
                const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
                hemiLight.position.set(0, 50, 0);
                scene.add(hemiLight);
                
                const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
                dirLight.position.set(20, 40, 20);
                dirLight.castShadow = true;
                scene.add(dirLight);

                // Environment
                const floorMat = new THREE.MeshStandardMaterial({ color: 0x312e81, roughness: 0.8 });
                const mainFloor = new THREE.Mesh(new THREE.CylinderGeometry(60, 60, 1, 64), floorMat);
                mainFloor.position.y = -0.5;
                scene.add(mainFloor);

                // Generate Loci Points & Place Objects along a path
                const interactableMeshes = [];
                const radiusStep = 3;
                const angleStep = 0.6;
                const generatedMapData = [];
                
                assignedData.forEach((data, index) => {
                    // Randomize shape and color since locations are user-defined
                    const shapeType = LOCI_SHAPES[index % LOCI_SHAPES.length];
                    const colorHex = LOCI_COLORS[index % LOCI_COLORS.length];
                    
                    let geo;
                    if(shapeType === 'box') geo = new THREE.BoxGeometry(2, 2, 2);
                    else if(shapeType === 'sphere') geo = new THREE.SphereGeometry(1.5, 32, 32);
                    else if(shapeType === 'cylinder') geo = new THREE.CylinderGeometry(1.2, 1.2, 2, 32);
                    else geo = new THREE.ConeGeometry(1.5, 3, 32);

                    const mat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.3, metalness: 0.2 });
                    const mesh = new THREE.Mesh(geo, mat);

                    // Calculate spiral position
                    const r = 10 + (index * 1.5);
                    const a = index * angleStep;
                    const posX = Math.cos(a) * r;
                    const posZ = Math.sin(a) * r;
                    
                    mesh.position.set(posX, 1.5, posZ);
                    
                    // Attach data for raycaster
                    mesh.userData = { 
                        vocabInfo: data, 
                        index: index + 1,
                        isLoci: true
                    };

                    scene.add(mesh);
                    interactableMeshes.push(mesh);

                    // Add Floating Indicator Above Object
                    const indicatorMat = new THREE.MeshBasicMaterial({ color: 0xffe4e6 });
                    const indicator = new THREE.Mesh(new THREE.OctahedronGeometry(0.4), indicatorMat);
                    indicator.position.set(0, 3, 0);
                    mesh.add(indicator);
                    mesh.userData.indicator = indicator;

                    // Save map data for 2D minimap
                    generatedMapData.push({ id: index+1, x: posX, z: posZ, name: data.location });
                });
                
                setMapData(generatedMapData);

                // Camera & Movement Logic
                let pitch = 0;
                let yaw = Math.PI / 2;
                const movementSpeed = 0.2;
                const lookSpeed = 0.005;

                // Mouse Control
                let isDragging = false;
                let previousMousePosition = { x: 0, y: 0 };

                const onPointerDown = (e) => {
                    // Prevent triggering rotation if clicking UI buttons
                    if(e.target.closest('.hud-ui')) return;
                    isDragging = true;
                    previousMousePosition = { x: e.clientX || e.touches[0].clientX, y: e.clientY || e.touches[0].clientY };
                };

                const onPointerMove = (e) => {
                    if (!isDragging) return;
                    const currentX = e.clientX || (e.touches && e.touches[0].clientX);
                    const currentY = e.clientY || (e.touches && e.touches[0].clientY);
                    
                    if (currentX === undefined) return;

                    const deltaX = currentX - previousMousePosition.x;
                    const deltaY = currentY - previousMousePosition.y;

                    yaw -= deltaX * lookSpeed;
                    pitch -= deltaY * lookSpeed;
                    pitch = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, pitch)); // Clamp pitch

                    previousMousePosition = { x: currentX, y: currentY };
                };

                const onPointerUp = () => { isDragging = false; };

                window.addEventListener('mousedown', onPointerDown);
                window.addEventListener('mousemove', onPointerMove);
                window.addEventListener('mouseup', onPointerUp);
                window.addEventListener('touchstart', onPointerDown, {passive: false});
                window.addEventListener('touchmove', onPointerMove, {passive: false});
                window.addEventListener('touchend', onPointerUp);

                // Keyboard Control
                const onKeyDown = (e) => {
                    if(e.key === 'w' || e.key === 'ArrowUp') keys.current.w = true;
                    if(e.key === 's' || e.key === 'ArrowDown') keys.current.s = true;
                    if(e.key === 'a') keys.current.a = true;
                    if(e.key === 'd') keys.current.d = true;
                    if(e.key === 'ArrowLeft') keys.current.left = true;
                    if(e.key === 'ArrowRight') keys.current.right = true;
                };
                const onKeyUp = (e) => {
                    if(e.key === 'w' || e.key === 'ArrowUp') keys.current.w = false;
                    if(e.key === 's' || e.key === 'ArrowDown') keys.current.s = false;
                    if(e.key === 'a') keys.current.a = false;
                    if(e.key === 'd') keys.current.d = false;
                    if(e.key === 'ArrowLeft') keys.current.left = false;
                    if(e.key === 'ArrowRight') keys.current.right = false;
                };
                window.addEventListener('keydown', onKeyDown);
                window.addEventListener('keyup', onKeyUp);

                // Raycaster for Interactions
                const raycaster = new THREE.Raycaster();
                const centerPoint = new THREE.Vector2(0, 0);
                let currentIntersect = null;

                // Map bounds for minimap normalization
                const mapRadius = 60; // Based on floor size

                // Render Loop
                let animationId;
                const clock = new THREE.Clock();

                const animate = () => {
                    const time = clock.getElapsedTime();
                    
                    if(keys.current.left) yaw += lookSpeed * 10;
                    if(keys.current.right) yaw -= lookSpeed * 10;

                    camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));

                    const forward = new THREE.Vector3();
                    camera.getWorldDirection(forward);
                    forward.y = 0;
                    forward.normalize();

                    const right = new THREE.Vector3();
                    right.crossVectors(camera.up, forward).normalize();

                    let moveForward = 0;
                    let moveRight = 0;

                    if(keys.current.w) moveForward += 1;
                    if(keys.current.s) moveForward -= 1;
                    if(keys.current.a) moveRight -= 1;
                    if(keys.current.d) moveRight += 1;

                    // Integrate Joystick movement (y inverted because upward drag is negative dy)
                    if (joystickRef.current.active) {
                        moveForward -= joystickRef.current.y;
                        moveRight += joystickRef.current.x;
                    }

                    if (moveForward !== 0) camera.position.addScaledVector(forward, moveForward * movementSpeed);
                    if (moveRight !== 0) camera.position.addScaledVector(right, moveRight * movementSpeed);

                    // Constrain player to floor
                    const distFromCenter = Math.sqrt(camera.position.x**2 + camera.position.z**2);
                    if (distFromCenter > 58) {
                        camera.position.normalize().multiplyScalar(58);
                        camera.position.y = 3;
                    }

                    // Update DOM Minimap Player Dot
                    if (playerDotRef.current) {
                        // Normalize 3D coordinates (-60 to 60) to Minimap percentages (0% to 100%)
                        const mapPctX = ((camera.position.x / mapRadius) + 1) * 50;
                        const mapPctY = ((camera.position.z / mapRadius) + 1) * 50;
                        playerDotRef.current.style.left = `${mapPctX}%`;
                        playerDotRef.current.style.top = `${mapPctY}%`;
                    }

                    // Animate Indicators
                    interactableMeshes.forEach(m => {
                        if (m.userData.indicator) {
                            m.userData.indicator.rotation.y = time;
                            m.userData.indicator.position.y = 2.5 + Math.sin(time*3)*0.2;
                        }
                    });

                    // Raycasting
                    raycaster.setFromCamera(centerPoint, camera);
                    const intersects = raycaster.intersectObjects(interactableMeshes);

                    if (intersects.length > 0 && intersects[0].distance < 12) { 
                        if (currentIntersect !== intersects[0].object) {
                            if (currentIntersect) currentIntersect.material.emissive.setHex(0x000000);
                            currentIntersect = intersects[0].object;
                            currentIntersect.material.emissive.setHex(0x333333);
                            
                            setInteractionInfo({
                                ...currentIntersect.userData.vocabInfo,
                                stepNumber: currentIntersect.userData.index
                            });
                        }
                    } else {
                        if (currentIntersect) {
                            currentIntersect.material.emissive.setHex(0x000000);
                            currentIntersect = null;
                            setInteractionInfo(null);
                        }
                    }

                    renderer.render(scene, camera);
                    animationId = requestAnimationFrame(animate);
                };
                
                animate();

                // Cleanup
                return () => {
                    cancelAnimationFrame(animationId);
                    window.removeEventListener('mousedown', onPointerDown);
                    window.removeEventListener('mousemove', onPointerMove);
                    window.removeEventListener('mouseup', onPointerUp);
                    window.removeEventListener('touchstart', onPointerDown);
                    window.removeEventListener('touchmove', onPointerMove);
                    window.removeEventListener('touchend', onPointerUp);
                    window.removeEventListener('keydown', onKeyDown);
                    window.removeEventListener('keyup', onKeyUp);
                    renderer.dispose();
                };
            }, []);

            // Handle UI button controls for mobile
            const handleTouchControl = (dir, state) => (e) => {
                e.preventDefault();
                keys.current[dir] = state;
            };

            return (
                <div className="relative w-full h-full">
                    {/* 3D Canvas */}
                    <canvas ref={canvasRef} id="game-canvas-container"></canvas>
                    
                    {/* Center Crosshair */}
                    <div className="crosshair"></div>

                    {/* Top HUD Area */}
                    <div className="absolute top-4 left-4 right-4 flex justify-between items-start pointer-events-none z-10 hud-ui">
                        <div className="glass-panel p-3 rounded-lg flex items-center gap-3">
                            <div className="w-10 h-10 min-w-[40px] rounded-full border-2 border-indigo-400 flex items-center justify-center bg-indigo-900/50 pointer-events-auto shadow-lg">
                                <svg className="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                                </svg>
                            </div>
                            <div className="text-white text-sm hidden sm:flex flex-col gap-1 max-w-lg pointer-events-auto">

                                <span className="text-xs text-slate-300 leading-relaxed italic">"Bayangkan kamu sedang berada di sebuah ruangan dan berjalan menyusuri suatu tempat atau mendekat ke benda itu. Visual disini hanya untuk membantumu merasakan sensasi berjalan. Kemampuan imajinasimu luar biasa!"</span>
                            </div>

                            <div className="minimap-container w-40 h-40 relative hidden sm:block overflow-hidden">
                                <div className="absolute top-1 left-2 text-[10px] font-bold text-sky-400 bg-slate-900/50 px-1 rounded z-20">PALACE MAP</div>
                                {/* Center cross marker for map origin */}
                                <div className="absolute top-1/2 left-1/2 w-full h-[1px] bg-sky-900/50 -translate-y-1/2"></div>
                                <div className="absolute top-1/2 left-1/2 w-[1px] h-full bg-sky-900/50 -translate-x-1/2"></div>
                                
                                {/* Map Dots */}

                                Selesai & Uji Memori ➔
                            </button>
                        </div>
                    </div>

                    {/* Contextual HUD Overlay (Shows when looking at object) */}
                    {interactionInfo && (
                        <div className="absolute bottom-32 left-1/2 -translate-x-1/2 w-11/12 max-w-lg glass-panel p-6 rounded-2xl border-2 border-amber-400 shadow-[0_0_20px_rgba(251,191,36,0.3)] z-20 pointer-events-none transform transition-all duration-300 animate-[bounce_0.5s_ease-out]">
                            <div className="text-amber-400 font-bold text-sm uppercase tracking-widest mb-2 border-b border-slate-600 pb-2 flex justify-between items-center">
                                <span>📍 Lokasi Ke-{interactionInfo.stepNumber}: {interactionInfo.location}</span>
                                <span className="bg-amber-500/20 px-2 py-1 rounded text-amber-300 text-xs shadow-inner"># {interactionInfo.stepNumber}</span>

                                <h3 className="text-4xl font-black text-white">{interactionInfo.en}</h3>

                            <div className="bg-slate-900/80 rounded-lg p-3 text-indigo-100 italic">
                                Sedang <span className="text-amber-300 font-bold">{interactionInfo.action}</span>

                    {/* Virtual Analog Joystick (Supports both Touch & Mouse for testing) */}
                    <div 
                        className="absolute bottom-8 left-8 w-28 h-28 rounded-full bg-white/10 border-2 border-white/30 backdrop-blur-sm z-30 hud-ui flex items-center justify-center touch-none select-none shadow-2xl cursor-pointer"
                        onTouchStart={(e) => {
                            const touch = e.touches[0];
                            const rect = e.currentTarget.getBoundingClientRect();
                            joystickRef.current.active = true;
                            joystickRef.current.centerX = rect.left + rect.width / 2;
                            joystickRef.current.centerY = rect.top + rect.height / 2;
                            updateJoystick(touch.clientX, touch.clientY);
                        }}
                        onTouchMove={(e) => {
                            if (!joystickRef.current.active) return;
                            const touch = e.touches[0];
                            updateJoystick(touch.clientX, touch.clientY);
                        }}
                        onTouchEnd={() => {
                            joystickRef.current.active = false;
                            joystickRef.current.x = 0;
                            joystickRef.current.y = 0;
                            const thumb = document.getElementById('mobile-joystick-thumb');
                            if (thumb) thumb.style.transform = `translate(0px, 0px)`;
                        }}
                        onMouseDown={(e) => {
                            const rect = e.currentTarget.getBoundingClientRect();
                            joystickRef.current.active = true;
                            joystickRef.current.centerX = rect.left + rect.width / 2;
                            joystickRef.current.centerY = rect.top + rect.height / 2;
                            updateJoystick(e.clientX, e.clientY);
                            
                            const onMouseMove = (ev) => {
                                updateJoystick(ev.clientX, ev.clientY);
                            };
                            const onMouseUp = () => {
                                joystickRef.current.active = false;
                                joystickRef.current.x = 0;
                                joystickRef.current.y = 0;
                                const thumb = document.getElementById('mobile-joystick-thumb');
                                if (thumb) thumb.style.transform = `translate(0px, 0px)`;
                                window.removeEventListener('mousemove', onMouseMove);
                                window.removeEventListener('mouseup', onMouseUp);
                            };
                            window.addEventListener('mousemove', onMouseMove);
                            window.addEventListener('mouseup', onMouseUp);
                        }}
                    >
                        <div 
                            id="mobile-joystick-thumb"
                            className="w-12 h-12 rounded-full bg-indigo-500/90 shadow-lg pointer-events-none transition-transform duration-75"
                            style={{ transform: 'translate(0px, 0px)' }}
                        ></div>
                    </div>
                </div>
            );
        };

        // 5. QUIZ MODE
        const ScreenQuiz = ({ assignedData, onRestart }) => {
            const [quizPhase, setQuizPhase] = useState('loci'); // 'loci', 'final', 'result'
            
            // Phase 1 States
            const [lociQuestions, setLociQuestions] = useState([]);
            const [currentLociQ, setCurrentLociQ] = useState(0);
            
            // Phase 2 States
            const [finalQuestions, setFinalQuestions] = useState([]);
            const [currentFinalQ, setCurrentFinalQ] = useState(0);
            const [typingAnswer, setTypingAnswer] = useState('');
            
            // Shared States
            const [score, setScore] = useState(0);
            const [feedback, setFeedback] = useState(null); // { status: 'correct'|'wrong', msg: '' }

            // Initialize Both Quizzes on Mount
            useEffect(() => {
                const shuffledData = [...assignedData].sort(() => 0.5 - Math.random());
                
                // --- Generate Phase 1 (Loci / Action Quiz) ---
                const numLociQ = Math.min(10, shuffledData.length);
                const lqs = [];
                for(let i=0; i<numLociQ; i++) {
                    const target = shuffledData[i];
                    const isActionQ = Math.random() > 0.5;

                    let qText, correctAnswer, options;

                    if (isActionQ) {
                        qText = `Dalam cerita konyolmu, apa yang sedang dilakukan / terjadi pada kosakata "${target.en}" (${target.id})?`;
                        correctAnswer = target.action;
                        const wrongOpts = assignedData.filter(d => d.action !== correctAnswer).sort(() => 0.5 - Math.random()).slice(0, 3).map(d => d.action);
                        options = [correctAnswer, ...wrongOpts].sort(() => 0.5 - Math.random());
                    } else {
                        qText = `Di mana kamu meletakkan kosakata "${target.en}" (${target.id})?`;
                        correctAnswer = target.location;
                        const wrongOpts = assignedData.filter(d => d.location !== correctAnswer).sort(() => 0.5 - Math.random()).slice(0, 3).map(d => d.location);
                        options = [correctAnswer, ...wrongOpts].sort(() => 0.5 - Math.random());
                    }
                    lqs.push({ qText, correctAnswer, options, ref: target });
                }
                setLociQuestions(lqs);

                // --- Generate Phase 2 (Final Translation Quiz Mix) ---
                const fqs = [];
                // Use all data for final exam
                shuffledData.forEach(target => {
                    const isEnToId = Math.random() > 0.5;
                    fqs.push({
                        type: isEnToId ? 'EN_TO_ID' : 'ID_TO_EN',
                        questionWord: isEnToId ? target.en : target.id,
                        correctAnswer: isEnToId ? target.id : target.en
                    });
                });
                // Shuffle again
                setFinalQuestions(fqs.sort(() => 0.5 - Math.random()));

            }, [assignedData]);

            // --- Handlers ---
            const handleLociAnswer = (opt) => {
                if (feedback) return;
                const q = lociQuestions[currentLociQ];
                const isCorrect = opt === q.correctAnswer;
                
                if (isCorrect) setScore(s => s + 1);
                
                setFeedback({
                    status: isCorrect ? 'correct' : 'wrong',
                    msg: isCorrect ? 'Tepat Sekali!' : `Salah! Yang benar: ${q.correctAnswer}`
                });

                setTimeout(() => {
                    setFeedback(null);
                    if (currentLociQ + 1 < lociQuestions.length) {
                        setCurrentLociQ(curr => curr + 1);
                    } else {
                        setQuizPhase('final');
                    }
                }, 2000);
            };

            const handleFinalSubmit = (e) => {
                e.preventDefault();
                if (feedback || !typingAnswer.trim()) return;

                const q = finalQuestions[currentFinalQ];
                const cleanInput = typingAnswer.trim().toLowerCase();
                const cleanTarget = q.correctAnswer.toLowerCase();
                
                const isCorrect = cleanInput === cleanTarget;
                if (isCorrect) setScore(s => s + 1);

                setFeedback({
                    status: isCorrect ? 'correct' : 'wrong',
                    msg: isCorrect ? 'Benar!' : `Salah! Jawaban: ${q.correctAnswer}`
                });

                setTimeout(() => {
                setFeedback(null);
                setTypingAnswer('');
                if (currentFinalQ + 1 < finalQuestions.length) { setCurrentFinalQ(curr=> curr + 1);
                    } else {
                    markTrialUsed(); // 🔒 REKAM TRIAL: detik terakhir sebelum layar skor

                    }, 2000);

            // --- Renders ---

        // --- MAIN APP CONTROLLER ---
const App = () => {
// Semua hooks dideklarasikan lebih dulu (aturan React), gembok dicek tepat setelahnya
const [isLocked, setIsLocked] = useState(() => isTrialUsed());

}

const handleMenuSelect = (count) => {
setDifficulty(count);
setScreen('input');
};

const handleInputComplete = (data) => {
setVocabs(data);
setScreen('assign');
};

const handleAssignComplete = (data) => {
setAssignedData(data);
setScreen('explore');
};

// Setelah trial selesai, tombol "Mulai Misi Baru" langsung mengarah ke gembok
const handleRestart = () => {
if (isTrialUsed()) setIsLocked(true);
else setScreen('menu');
};

return (
<div className="w-full h-full">
    {screen === 'menu' &&
    <ScreenMenu onSelect={handleMenuSelect} />}
    {screen === 'input' &&
    <ScreenInput count={difficulty} onComplete={handleInputComplete} />}
    {screen === 'assign' &&
    <ScreenAssign vocabs={vocabs} lociLimit={difficulty} onComplete={handleAssignComplete} />}
    {screen === 'explore' && <ScreenExplore assignedData={assignedData} onFinishWalk={()=> setScreen('quiz')} />}
        {screen === 'quiz' &&
        <ScreenQuiz assignedData={assignedData} onRestart={handleRestart} />}
</div>
);
};

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
